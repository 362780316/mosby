apply plugin: 'com.android.library'
apply from: '../maven-push.gradle'
apply from: '../findbugs.gradle'

android {

  compileSdkVersion rootProject.ext.compileSdkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdk
    targetSdkVersion rootProject.ext.targetSdk
    versionName project.VERSION_NAME
    versionCode Integer.parseInt(project.VERSION_CODE)

    packagingOptions {
      exclude 'LICENSE.txt'
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility rootProject.ext.javaSourceCompatibility
    targetCompatibility rootProject.ext.javaTargetCompatibility
  }

  /*
  testOptions {
    unitTests.returnDefaultValues = true
  }
  */
}

dependencies {

  api 'androidx.appcompat:appcompat:' + rootProject.ext.appcompatVersion
  api 'androidx.legacy:legacy-support-v4:' + rootProject.ext.androidxLegacySupportVersion
  api 'androidx.collection:collection:' + rootProject.ext.androidxCollectionVersion
  api 'androidx.core:core:' + rootProject.ext.androidxCoreVersion
  api 'androidx.customview:customview:' + rootProject.ext.androidxCustomViewVersion

  api project(':mvp-common')

  testImplementation 'junit:junit:' + rootProject.ext.junitVersion
  testImplementation 'org.mockito:mockito-core:' + rootProject.ext.mockitoVersion
  //testImplementation 'org.mockito:mockito-android:'+ rootProject.ext.mockitoVersion


  testImplementation "org.robolectric:robolectric:"+rootProject.ext.robolectricVersion


  testImplementation('org.powermock:powermock-api-mockito:' + rootProject.ext.powermockVersion) {
    exclude module: 'hamcrest-core'
    exclude module: 'objenesis'
  }
  testImplementation('org.powermock:powermock-module-junit4:' + rootProject.ext.powermockVersion) {
    exclude module: 'hamcrest-core'
    exclude module: 'objenesis'
  }
}
