// Top-level build file where you can add configuration options common to all sub-projects/modules.

apply plugin: 'maven-publish'

def requestedPublishedGroupId = gradle.startParameter.projectProperties.containsKey('group') ?
    gradle.startParameter.projectProperties['group'] : GROUP
ext.publishedGroupId = gradle.startParameter.projectProperties.containsKey('publishedGroup') ?
    gradle.startParameter.projectProperties['publishedGroup'] :
    (gradle.startParameter.projectProperties.containsKey('group') &&
        requestedPublishedGroupId.startsWith('com.github.') ?
        requestedPublishedGroupId + '.' + rootProject.name : requestedPublishedGroupId)
ext.publishedVersion = gradle.startParameter.projectProperties.containsKey('version') ?
    gradle.startParameter.projectProperties['version'] : VERSION_NAME

def aggregateArtifactIds = [
    'mvp-common',
    'mvp',
    'mvp-lce',
    'mvp-nullobject-presenter',
    'mvp-queuing-presenter',
    'mvi-common',
    'mvi',
    'presentermanager',
    'utils-fragment',
    'viewstate'
]

publishing {
  publications {
    mosby(MavenPublication) {
      groupId = rootProject.ext.publishedGroupId
      artifactId = rootProject.name
      version = rootProject.ext.publishedVersion

      pom {
        name = rootProject.name
        description = POM_DESCRIPTION
        url = POM_URL
        packaging = 'pom'

        scm {
          url = POM_SCM_URL
          connection = POM_SCM_CONNECTION
          developerConnection = POM_SCM_DEV_CONNECTION
        }

        licenses {
          license {
            name = POM_LICENCE_NAME
            url = POM_LICENCE_URL
            distribution = POM_LICENCE_DIST
          }
        }

        developers {
          developer {
            id = POM_DEVELOPER_ID
            name = POM_DEVELOPER_NAME
          }
        }

        withXml {
          def dependenciesNode = asNode().appendNode('dependencies')
          aggregateArtifactIds.each { artifact ->
            def dependencyNode = dependenciesNode.appendNode('dependency')
            dependencyNode.appendNode('groupId', rootProject.ext.publishedGroupId)
            dependencyNode.appendNode('artifactId', artifact)
            dependencyNode.appendNode('version', rootProject.ext.publishedVersion)
            dependencyNode.appendNode('scope', 'compile')
          }
        }
      }
    }
  }
}

buildscript {

  repositories {
    mavenCentral()
    jcenter()
    maven {
      url "https://maven.google.com"
    }
      google()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:7.4.2'
    //  classpath 'com.getkeepsafe.dexcount:dexcount-gradle-plugin:0.5.2'
    //classpath 'me.tatarka:gradle-retrolambda:3.5.0'
  }
}

allprojects {
  group = rootProject.ext.publishedGroupId
  version = rootProject.ext.publishedVersion

  repositories {
    mavenCentral()
    jcenter()
    maven {
      url 'https://oss.sonatype.org/content/repositories/snapshots/'
    }

    maven {
      url "https://jitpack.io"
    }

    maven {
      url 'https://clojars.org/repo/'
    }

    maven {
      url "https://maven.google.com"
    }
  }
}

subprojects {
  tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.jvmArgs += [
        '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED'
    ]
  }
}


ext {
  minSdk = 14
  targetSdk = 25
  buildToolsVersion = '28.0.1'
  compileSdkVersion = 28

  javaSourceCompatibility = JavaVersion.VERSION_1_8
  javaTargetCompatibility = JavaVersion.VERSION_1_8

  // Libraries
  appcompatVersion = '1.0.2'
  androidxAnnotationVersion = '1.0.2'
  androidxCollectionVersion = '1.0.0'
  androidxCoreVersion = '1.0.2'
  androidxCustomViewVersion = '1.0.0'
  androidxFragmentVersion = '1.0.0'
  androidxLegacySupportVersion = '1.0.0'
  cardViewVersion = '1.0.0'
  constraintLayoutVersion = '1.1.3'
  drawerLayoutVersion = '1.0.0'
  materialVersion = '1.0.0'
  recyclerViewVersion = '1.0.0'
  swipeRefreshLayoutVersion = '1.0.0'
  transitionVersion = '1.0.1'
  viewPagerVersion = '1.0.0'
  rxjava2Version = '2.0.7'
  rxAndroid2Version = '2.0.1'


  // Libraries for samples
  fragmentargsVersion = '2.1.0'
  butterknifeVersion = '10.2.3'
  icepickVersion = '3.0.2'
  retrofitVersion = '1.9.0'
  picassoVersion = '2.5.2'
  okhttpVersion = '2.3.0'
  parcelablepleaseVersion = '1.0.1'
  rxjavaVersion = '1.0.16'
  rxandroidVersion = '1.0.1'
  dagger2Version = '2.0'


  // Test Libs
  robolectricVersion = '3.1.4'
  junitVersion = '4.12'
  mockitoVersion = '2.0.5-beta'
  powermockVersion = '1.6.2'
  leakcanaryVersion = '1.5'
  androidXTestVersion = '1.1.1'
}
