apply plugin: 'maven-publish'
apply plugin: 'signing'

def isReleaseBuild() {
  return rootProject.ext.publishedVersion.contains("SNAPSHOT") == false
}

def shouldSignPublication() {
  return isReleaseBuild() && gradle.taskGraph.allTasks.any {
    it.name.startsWith('publish') &&
        it.name != 'publishToMavenLocal' &&
        !it.name.endsWith('ToMavenLocal')
  }
}

def getReleaseRepositoryUrl() {
  return hasProperty('RELEASE_REPOSITORY_URL') ? RELEASE_REPOSITORY_URL :
      "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
}

def getSnapshotRepositoryUrl() {
  return hasProperty('SNAPSHOT_REPOSITORY_URL') ? SNAPSHOT_REPOSITORY_URL :
      "https://oss.sonatype.org/content/repositories/snapshots/"
}

def getRepositoryUsername() {
  return hasProperty('NEXUS_USERNAME') ? NEXUS_USERNAME : ""
}

def getRepositoryPassword() {
  return hasProperty('NEXUS_PASSWORD') ? NEXUS_PASSWORD : ""
}

def configurePom = { pom ->
  pom.name = POM_NAME
  pom.description = POM_DESCRIPTION
  pom.url = POM_URL
  pom.packaging = POM_PACKAGING

  pom.scm {
    url = POM_SCM_URL
    connection = POM_SCM_CONNECTION
    developerConnection = POM_SCM_DEV_CONNECTION
  }

  pom.licenses {
    license {
      name = POM_LICENCE_NAME
      url = POM_LICENCE_URL
      distribution = POM_LICENCE_DIST
    }
  }

  pom.developers {
    developer {
      id = POM_DEVELOPER_ID
      name = POM_DEVELOPER_NAME
    }
  }
}

java {
  withSourcesJar()
  withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
  failOnError = false

  if (JavaVersion.current().isJava8Compatible()) {
    options.addStringOption('Xdoclint:none', '-quiet')
  }
}

afterEvaluate {
  publishing {
    publications {
      mavenJava(MavenPublication) {
        from components.java

        groupId = rootProject.ext.publishedGroupId
        artifactId = POM_ARTIFACT_ID
        version = rootProject.ext.publishedVersion

        pom(configurePom)
      }
    }

    repositories {
      maven {
        url = uri(isReleaseBuild() ? getReleaseRepositoryUrl() : getSnapshotRepositoryUrl())
        credentials {
          username = getRepositoryUsername()
          password = getRepositoryPassword()
        }
      }
    }
  }

  signing {
    required { shouldSignPublication() }
    sign publishing.publications.mavenJava
  }

  tasks.register('uploadArchives') {
    dependsOn tasks.named('publish')
  }
}
