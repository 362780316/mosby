configurations {
  findbugsTool
}

dependencies {
  findbugsTool 'com.google.code.findbugs:findbugs:3.0.1'
}

afterEvaluate {
  def variants = plugins.hasPlugin('com.android.application') ? android.applicationVariants :
      android.libraryVariants

  variants.all { variant ->
    def variantName = variant.name.capitalize()
    def javaCompileProvider = variant.javaCompileProvider

    def findbugsTask = tasks.register("findBugs${variantName}", JavaExec) {
      group = 'verification'
      description = "Run FindBugs for the ${variant.name} variant."

      mainClass.set('edu.umd.cs.findbugs.FindBugs2')
      classpath = configurations.findbugsTool
      dependsOn javaCompileProvider

      doFirst {
        def javaCompile = javaCompileProvider.get()
        def classesDir = javaCompile.destinationDirectory.get().asFile
        def reportFile = layout.buildDirectory.file("reports/findbugs/${variant.name}.html").get().asFile
        def filterFile = rootProject.file('findbugs-filter.xml')
        def auxClasspath = javaCompile.classpath.plus(project.files(android.bootClasspath))

        reportFile.parentFile.mkdirs()

        args = [
            '-textui',
            '-effort:max',
            '-high',
            '-html',
            '-output',
            reportFile.absolutePath,
            '-auxclasspath',
            auxClasspath.asPath
        ]

        if (filterFile.exists()) {
          args += ['-exclude', filterFile.absolutePath]
        }

        args += classesDir.absolutePath
      }
    }

    tasks.named('check').configure {
      dependsOn findbugsTask
    }
  }
}
